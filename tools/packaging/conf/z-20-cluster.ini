# Hive + Trino + HBase cluster connectors
# =======================================
# Usage:
#   cp conf/z-20-cluster.ini.example conf/z-20-cluster.ini
#   edit hosts / passwords / paths to match your cluster
#   ./bin/start.sh
#
# Notes:
# - Trino: needs Hue master (notebook.connectors.trino); verify:false for self-signed HTTPS.
# - Hive: hive_conf_dir must be readable on the Hue host (hive-site.xml).
# - HDFS/YARN: do NOT leave localhost — Job Browser / File Browser need real NN/RM hosts.
#   Hadoop 3.x NN Web UI is often 9870 (Hadoop 2.x was 50070). RM Web UI is usually 8088.
# - HBase: points at HBase Thrift Server (API v1), NOT RegionServer RPC / Master UI.
#   Thrift transport must be buffered (framed is NOT supported by Hue).
#   hbase_conf_dir must contain hbase-site.xml on the Hue host.

[hadoop]
[[hdfs_clusters]]
[[[default]]]
# Replace host/port with your NameNode (fs.defaultFS + WebHDFS/HttpFS)
fs_defaultfs=hdfs://node53:8020
# Hadoop 3: http://<nn>:9870/webhdfs/v1   Hadoop 2: :50070
webhdfs_url=http://node53:9870/webhdfs/v1
hadoop_conf_dir=/opt/gbaseHD/hadoop/etc/hadoop
# security_enabled=false
# webhdfs_url=http://node53:14000/webhdfs/v1   # if using HttpFS instead

[[yarn_clusters]]
[[[default]]]
resourcemanager_host=node53
resourcemanager_port=8032
submit_to=True
resourcemanager_api_url=http://node53:8088
proxy_api_url=http://node53:8088
history_server_api_url=http://node53:19888
# security_enabled=false

[beeswax]
hive_server_host=node53
hive_server_port=10000
hive_conf_dir=/opt/gbaseHD/hive/conf
auth_username=hive
auth_password=hive123
use_sasl=true

[metastore]
enable_new_create_table=true

[hbase]
# (DisplayName|thrift_host:thrift_port) — default Thrift port is often 9090
hbase_clusters=(Cluster|node53:9090)
hbase_conf_dir=/opt/gbaseHD/hbase/conf
# thrift_transport=buffered
# ssl_cert_ca_verify=true

[notebook]
[[interpreters]]
[[[hive]]]
name=Hive
interface=hiveserver2

[[[trino]]]
name=Trino
interface=trino
options='{"url": "https://172.16.5.51:8446", "auth_username": "hive", "auth_password": "hive123", "verify": false}'
