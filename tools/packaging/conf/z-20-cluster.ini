# Hive + Trino + HBase cluster connectors
# =======================================
# Usage:
#   cp conf/z-20-cluster.ini.example conf/z-20-cluster.ini
#   edit hosts / passwords / paths to match your cluster
#   ./bin/start.sh
#
# Notes:
# - Trino: needs Hue master (notebook.connectors.trino); verify:false for self-signed HTTPS.
# - Hive: hive_conf_dir must be readable on the Hue host (hive-site.xml).
# - HBase: points at HBase Thrift Server (API v1), NOT RegionServer RPC.
#   Thrift transport must be buffered (framed is NOT supported by Hue).
#   hbase_conf_dir must contain hbase-site.xml on the Hue host.

[beeswax]
hive_server_host=node53
hive_server_port=10000
hive_conf_dir=/export/servers/hive/conf
auth_username=hive
auth_password=hive123
use_sasl=true

[metastore]
enable_new_create_table=true

[hbase]
# (DisplayName|thrift_host:thrift_port) — default Thrift port is often 9090
hbase_clusters=(Cluster|node53:9090)
hbase_conf_dir=/export/servers/hbase/conf
# thrift_transport=buffered
# ssl_cert_ca_verify=true

[notebook]
[[interpreters]]
[[[hive]]]
name=Hive
interface=hiveserver2

[[[trino]]]
name=Trino
interface=trino
options='{"url": "https://172.16.5.51:8446", "auth_username": "hive", "auth_password": "hive123", "verify": false}'
