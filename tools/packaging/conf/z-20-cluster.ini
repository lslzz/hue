# Generated by GBaseHD — conf/z-20-cluster.ini
# Hive + Trino + HBase + HDFS/YARN connectors
# ===========================================
# Usage:
#   cp conf/z-20-cluster.ini.example conf/z-20-cluster.ini
#   adjust hosts/passwords if your cluster differs, then ./bin/huectl restart
#
# Notes:
# - HDFS HA: fs_defaultfs uses nameservice id (see hadoop_conf_dir).
# - YARN HA: two yarn_clusters entries (rm1 / rm2) with submit_to=True.
# - Hive: hive_discovery_hs2 + ZooKeeper ensemble for HS2 discovery.
# - Trino: options.verify=false for self-signed HTTPS.

[hadoop]
[[hdfs_clusters]]
[[[default]]]
fs_defaultfs=hdfs://nameservice1
webhdfs_url=http://node53:9870/webhdfs/v1
hadoop_conf_dir=/opt/gbaseHD/hadoop/etc/hadoop

[[yarn_clusters]]
[[[default]]]
resourcemanager_host=node51
resourcemanager_port=8032
submit_to=True
logical_name=rm1
resourcemanager_api_url=http://node51:8088
proxy_api_url=http://node51:8088
history_server_api_url=http://node51:19888
[[[ha]]]
resourcemanager_host=node53
resourcemanager_port=8032
submit_to=True
logical_name=rm2
resourcemanager_api_url=http://node53:8088
proxy_api_url=http://node53:8088

[beeswax]
hive_discovery_hs2=true
hive_discovery_hiveserver2_znode=/hiveserver2
hive_server_host=node51
hive_server_port=10000
hive_conf_dir=/opt/gbaseHD/hive/conf
auth_username=hive
auth_password=hive123
use_sasl=true

[metastore]
enable_new_create_table=true

[libzookeeper]
ensemble=node51:2181,node53:2181,node54:2181

[zookeeper]
[[clusters]]
[[[default]]]
host_ports=node51:2181,node53:2181,node54:2181


[notebook]
[[interpreters]]
[[[hive]]]
name=Hive
interface=hiveserver2

[[[trino]]]
name=Trino
interface=trino
options='{"url": "https://node51:8446", "auth_username": "hive", "auth_password": "hive123", "verify": false}'
