# Packaging defaults (merged after desktop/conf hue.ini)
# =====================================================

[desktop]

# CHANGE THIS in production
secret_key=packaging-change-me-to-a-long-random-string

http_host=0.0.0.0
http_port=8000

time_zone=Asia/Shanghai

django_debug_mode=false
http_500_debug_mode=false

# Prefer gunicorn in packaged deployments
use_cherrypy_server=false
gunicorn_work_class=sync
gunicorn_number_of_workers=2

# Drop-privilege account. bin/start.sh overwrites these at runtime to the
# invoking user/group via conf/z-96-runtime-user.ini so a dedicated "hue"
# OS account is not required.
server_user=root
server_group=root

# This packaging targets Hive/Trino/HBase + external schedulers (e.g. DolphinScheduler).
# Disable unused apps so Hue does not probe localhost Oozie/Solr.
app_blacklist=oozie,jobsub,search

# Hue Celery Beat "Scheduled Tasks" needs django_celery_beat in INSTALLED_APPS + broker.
# Keep off — use DolphinScheduler instead of Hue's built-in beat scheduler.
[[task_server]]
enabled=false
beat_enabled=false

[[task_server_v2]]
enabled=false
beat_enabled=false

# Database:
# - If you do NOT configure MySQL/Postgres, bin/start.sh writes z-95-sqlite.ini
#   and uses embedded SQLite under ./data/desktop.db
# - To use external MySQL: copy z-90-database.mysql.ini.example to
#   z-90-database.ini, fill values, restart.

[liboozie]
# Empty URL skips Oozie config checks and REST calls.
oozie_url=

[search]
# Empty URL disables Solr Index Browser probes (default would be localhost:8983).
solr_url=
